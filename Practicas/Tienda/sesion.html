<!DOCTYPE html> 
<html lang="es"> 
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
   <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }

    main {
      flex: 1;
      padding: 20px 0;
    }

    nav, footer {
      background: #D3D3D3;
      padding: 15px 0;
    }

    nav {
      margin: 15px 0 25px;
    }

    .nav-links {
      display: flex;
      gap: 60px;
      justify-content: center;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .nav-links a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
    }

    .seccion-formulario {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px; 
      flex-wrap: wrap; 
      margin-top: 20px;
    }

    form {
      text-align: left;
      line-height: 2.2;
    }

    .imagen-producto {
      max-width: 300px; 
      height: auto;
      border-radius: 8px;
    }

    footer {
      margin-top: auto;
      font-size: 0.5rem;
    }

     .curiosidades-container {
  display: flex;
  gap: 20px; 
  justify-content: center; 
  max-width: 1100px; 
  margin: 0 auto; 
}

.curiosidad-card {
  background: #f0f0f0; 
  padding: 15px; 
  flex: 0.5; 
  border-radius: 10px; 
  
 
  display: flex;
  flex-direction: column;
  align-items: center; 
  justify-content: center; 
}
  </style>
</head> 
<body> 

  <main>
    <h1>Nike</h1>

    <nav>
      <ul class="nav-links">
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="servicio.html">Servicio al cliente</a></li>
        <li><a href="cupones.html">Cupones</a></li>
        <li><a href="vender.html">Vender</a></li>
      </ul>
    </nav>

<h2>Iniciar sesion </h2>
    <h3>Rellene los datos solicitados</h3> 
<div class="curiosidades-container">
      <div class="curiosidad-card">

    <div class="seccion-formulario">
      <form action="" method="post"> 
        Nombre/s: 
        <input type="text" name="nombre"> 
        <br> 
        Numero de telefono:
        <input type="text" name="telefono"> 
        <br>
        Correo electronico:
        <input type="text" name="correo"> 
        <br>
        <h3>Fecha de nacimiento </h3>
        Dia:
        <input type="text" name="dia"
        <br>
        Mes:
        <input type="text" name="mes"
        <br>
        Año:
        <input type="text" name="año"

        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button> 
      </form> 
    </div>

      <img src="vibradorcemento.png" alt="Vibrador de cemento" class="imagen-producto">
    </div>


  </main>

</body> 
</html>
