<!DOCTYPE html> <!-- Indica que es un documento HTML5 -->
<html lang="es"> <!-- Idioma de la página -->
<head> <!-- Configuración de la página -->
  <meta charset="UTF-8"> <!-- Permite acentos y letra ñ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la pantalla -->
  <title>Formulario con Archivos</title> <!-- Título de la pestaña -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> <!-- Librería de íconos -->
</head> <!-- Fin de configuración -->
<body> <!-- Contenido visible -->

<h2>Formulario con archivos</h2> <!-- Título principal -->
<form action="" method="post"> <!-- Abre el formulario -->
  Ingresa tu nombre: <!-- Texto de ayuda -->
  <input type="text" name="nombre"> <!-- Caja para escribir nombre -->
  <br> <!-- Salto de línea -->
  <input type="file" name="archivo"> <!-- Botón para subir un archivo desde tu equipo -->
  <br> <!-- Salto de línea -->
  <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- Botón para enviar con ícono -->
  <button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- Botón para borrar con ícono -->
</form> <!-- Cierra el formulario -->

</body> <!-- Fin del contenido visible -->
</html> <!-- Fin del documento HTML -->
