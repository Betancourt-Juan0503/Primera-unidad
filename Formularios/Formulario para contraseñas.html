<!DOCTYPE html> <!-- Indica que es un documento HTML5 -->
<html lang="es"> <!-- Idioma de la página -->
<head> <!-- Configuración de la página -->
  <meta charset="UTF-8"> <!-- Permite acentos y letra ñ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la pantalla a móviles y computadoras -->
  <title>Formulario para Contraseñas</title> <!-- Título de la pestaña -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> <!-- Librería de íconos -->
</head> <!-- Fin de configuración -->
<body> <!-- Contenido visible -->

<h2>Formulario para contraseñas</h2> <!-- Título principal -->
<form action="" method="post"> <!-- Abre el formulario que envía datos a esta misma página -->

  Ingresa tu usuario: <!-- Texto de ayuda -->
  <input type="text" name="usuario"> <!-- Caja para escribir tu nombre de usuario -->
  Ingresa tu contraseña: <!-- Texto de ayuda -->
  <input type="password" name="pass"> <!-- Caja para contraseña que oculta el texto con puntos -->
  <br> <!-- Salto de línea -->
  <input type="submit" value="enviar"> <!-- Botón para enviar datos -->
  <input type="reset" value="borrar"> <!-- Botón para borrar todo -->
</form> <!-- Cierra el formulario -->

</body> <!-- Fin del contenido visible -->
</html> <!-- Fin del documento HTML -->
