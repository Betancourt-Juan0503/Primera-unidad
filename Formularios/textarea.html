<!DOCTYPE html> <!-- Indica que es un documento HTML5 -->
<html lang="es"> <!-- Idioma de la página -->
<head> <!-- Inicio de la configuración de la página -->
  <meta charset="UTF-8"> <!-- Permite mostrar acentos y letra ñ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta la página al tamaño de pantalla del teléfono o computadora -->
  <title>Formulario con Textarea</title> <!-- Título de la pestaña del navegador -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> <!-- Librería para mostrar íconos -->
</head> <!-- Fin de la configuración -->
<body> <!-- Inicio del contenido visible -->

<h2>Formulario con text area</h2> <!-- Título principal -->
<form action="" method="post"> <!-- Abre el formulario que envía datos a esta misma página -->
  Ingresa tu nombre: <!-- Texto de ayuda -->
  <input type="text" name="nombre"> <!-- Caja para escribir tu nombre -->
  <br> <!-- Salto de línea -->
  Ingresa tu correo: <!-- Texto de ayuda -->
  <input type="email" name="correo"> <!-- Caja especial para escribir un correo -->
  <br> <!-- Salto de línea -->
  Ingresa tus comentarios: <!-- Texto de ayuda -->
  <textarea name="comentarios" rows="1" cols="10"></textarea> <!-- Caja grande para mensajes largos -->
  <br> <!-- Salto de línea -->
  <input type="submit" value="enviar"> <!-- Botón para enviar datos -->
  <input type="reset" value="borrar"> <!-- Botón para borrar todo -->
</form> <!-- Cierra el formulario -->

</body> <!-- Fin del contenido visible -->
</html> <!-- Fin del documento HTML -->
