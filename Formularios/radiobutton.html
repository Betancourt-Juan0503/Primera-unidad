<!DOCTYPE html> <!-- Indica que es un documento HTML5 -->
<html lang="es"> <!-- Idioma de la página -->
<head> <!-- Configuración de la página -->
  <meta charset="UTF-8"> <!-- Permite acentos y letra ñ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la pantalla -->
  <title>Formulario con Radiobutton</title> <!-- Título de la pestaña -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> <!-- Librería de íconos -->
</head> <!-- Fin de configuración -->
<body> <!-- Contenido visible -->

<h2>Formularios con Radioboton</h2> <!-- Título principal -->
<form action="" method="post"> <!-- Abre el formulario -->
  Ingresa tu nombre: <!-- Texto de ayuda -->
  <input type="text" name="nombre"> <!-- Caja para escribir nombre -->
  <br> <!-- Salto de línea -->
  Selecciona el maximo de estudios que tienes: <!-- Instrucción al usuario -->
  <br> <!-- Salto de línea -->
  <input type="radio" name="estudios" value="1">Sin estudios <br> <!-- Círculo de selección única (opción 1) -->
  <input type="radio" name="estudios" value="2">Primaria <br> <!-- Círculo de selección única (opción 2) -->
  <input type="radio" name="estudios" value="3">Secundaria <br> <!-- Círculo de selección única (opción 3) -->
  <input type="radio" name="estudios" value="4">Preparatoria <br> <!-- Círculo de selección única (opción 4) -->
  <input type="submit" value="enviar"> <!-- Botón para enviar -->
  <input type="reset" value="borrar"> <!-- Botón para borrar -->
</form> <!-- Cierra el formulario -->

</body> <!-- Fin del contenido visible -->
</html> <!-- Fin del documento HTML -->
